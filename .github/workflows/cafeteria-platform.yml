name: Cafeteria platform

# The standalone cafeteria (cafeteria-platform/, ADR 0014): its own backend tests and the
# build of its screens, which are copies of the EUISIS screens and the EUISIS cafeteria
# backend. Runs when the platform or the copied EUISIS sources change, and fails when the
# copy has drifted.
on:
  push:
    branches: [ "main" ]
    paths: [ "cafeteria-platform/**", "resources/js/**", "resources/css/**", "packages/euisis-ui/**", "lang/**", "app/Services/Cafeteria/**", "app/Actions/Cafeteria/**", "app/Http/Controllers/Web/Cafeteria/**", "app/Http/Controllers/Web/Cafeteria*.php", "app/Http/Controllers/ProviderPortal/**", "app/Models/Cafeteria*.php", "app/Models/Provider*.php", "app/Models/Service*.php", "app/Enums/Cafeteria*.php", "app/Policies/*Cafeteria*.php", "app/Backbone/**", "config/cafeteria.php", "config/features.php", ".github/workflows/cafeteria-platform.yml" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "cafeteria-platform/**", "resources/js/**", "resources/css/**", "packages/euisis-ui/**", "lang/**", "app/Services/Cafeteria/**", "app/Actions/Cafeteria/**", "app/Http/Controllers/Web/Cafeteria/**", "app/Http/Controllers/Web/Cafeteria*.php", "app/Http/Controllers/ProviderPortal/**", "app/Models/Cafeteria*.php", "app/Models/Provider*.php", "app/Models/Service*.php", "app/Enums/Cafeteria*.php", "app/Policies/*Cafeteria*.php", "app/Backbone/**", "config/cafeteria.php", "config/features.php", ".github/workflows/cafeteria-platform.yml" ]

jobs:
  cafeteria-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cafeteria-platform/backend
    steps:
    - uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
      with:
        php-version: '8.4'
        extensions: pdo_sqlite, mbstring, intl, gd
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: composer install -q --no-ansi --no-interaction --no-progress --prefer-dist
    - name: Dependency audit
      run: composer audit --locked --no-interaction
    - name: Prepare environment
      run: |
        cp .env.example .env
        php artisan key:generate
    - name: Code style
      run: vendor/bin/pint --test app config database routes tests
    - name: Tests
      run: php artisan test

  # The same suite on PHP 8.5, the version the live web hosts run.
  cafeteria-backend-php85:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cafeteria-platform/backend
    steps:
    - uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
      with:
        php-version: '8.5'
        extensions: pdo_sqlite, mbstring, intl, gd
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: composer install -q --no-ansi --no-interaction --no-progress --prefer-dist
    - name: Prepare environment
      run: |
        cp .env.example .env
        php artisan key:generate
    - name: Tests
      run: php artisan test

  cafeteria-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cafeteria-platform/frontend
    steps:
    - uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
      with:
        php-version: '8.4'
    - uses: actions/checkout@v4
    - name: Backend packages (route() helper)
      working-directory: cafeteria-platform/backend
      run: composer install -q --no-ansi --no-interaction --no-progress --prefer-dist
    - uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'
        cache-dependency-path: cafeteria-platform/frontend/package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: The screens and the cafeteria backend are an unchanged copy of EUISIS
      run: |
        node scripts/sync-from-euisis.mjs ../..
        git diff --exit-code -- . ../backend/lang ../backend/app ../backend/config/cafeteria.php ../backend/config/features.php ../backend/database/seeders
    - name: Dependency audit
      run: npm audit --audit-level=high
    - name: Type check
      run: npm run typecheck
    - name: Build
      run: npm run build

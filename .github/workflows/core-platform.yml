name: Core platform

# The standalone Core (core-platform/): its own backend tests and frontend build,
# run only when the Core changes.
on:
  push:
    branches: [ "main" ]
    paths: [ "core-platform/**", ".github/workflows/core-platform.yml" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "core-platform/**", ".github/workflows/core-platform.yml" ]

jobs:
  core-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core-platform/backend
    steps:
    - uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
      with:
        php-version: '8.4'
        extensions: pdo_sqlite, mbstring, intl
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: composer install -q --no-ansi --no-interaction --no-progress --prefer-dist
    - name: Dependency audit
      run: composer audit --locked --no-interaction
    - name: Prepare environment
      run: |
        cp .env.example .env
        php artisan key:generate
    - name: Code style
      run: vendor/bin/pint --test app config database routes tests
    - name: Tests
      run: php artisan test

  core-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core-platform/frontend
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'
        cache-dependency-path: core-platform/frontend/package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: Dependency audit
      run: npm audit --audit-level=high
    - name: Type check
      run: npm run typecheck
    - name: Build
      run: npm run build

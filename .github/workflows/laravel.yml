name: Laravel

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Audits, style and translation checks run once; they do not depend on the
  # PHP version or on which tests are in a shard.
  checks:

    runs-on: ubuntu-latest

    steps:
    - uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
      with:
        php-version: '8.4'
        extensions: bcmath, pdo_sqlite, intl, gd, zip, mbstring, opcache
        coverage: none
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        # The production build target (Node 24 LTS; 22 LTS is the fallback). Node 20 is end of life.
        node-version-file: '.nvmrc'
        cache: 'npm'
    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"
    - name: Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
    - name: Dependency audit (release gate, docs/governance/release-management.md)
      # Any known advisory in a PHP package, or a high/critical one in the
      # npm tree, blocks the merge until it is patched or formally accepted.
      run: |
        composer audit --locked --no-interaction
        npm audit --audit-level=high
    - name: Code style (Pint)
      run: vendor/bin/pint --test app Modules config database routes tests
    - name: Install frontend dependencies
      run: npm ci --no-audit --no-fund
    - name: Translation audit (English and Amharic)
      # Blocks missing keys, English left in Amharic, raw status codes and
      # deprecated Amharic terms (docs/amharic-terminology-guide.md).
      run: npm run i18n:audit

  # The suite is ~4,700 tests and outgrew a single runner (16+ minutes). It runs
  # as six shards (phpunit.xml.dist, docs/testing.md) on PHP 8.4 and on 8.5,
  # the version the live web hosts run. Shard6 catches every directory not
  # named in Shard1-5, so a new test directory is never silently skipped.
  # A shard that hangs (PerformanceWorkflowTest has, intermittently) fails at
  # the timeout instead of holding the runner for six hours.
  tests:

    runs-on: ubuntu-latest
    name: tests (PHP ${{ matrix.php }}, shard ${{ matrix.shard }})
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        shard: ['1', '2', '3', '4', '5', '6']

    steps:
    - uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
      with:
        # Laravel 13 needs PHP >= 8.3; the lock also installs on 8.4 and 8.5 (live hosts).
        php-version: ${{ matrix.php }}
        # bcmath: Daily Work performance calculation (bccomp/bcdiv).
        extensions: bcmath, pdo_sqlite, intl, gd, zip, mbstring, opcache
        # Every test boots a fresh application and re-includes config and
        # route files; without the CLI opcache each re-compile is kept until
        # the process ends and the suite outgrows phpunit's memory_limit.
        ini-values: opcache.enable_cli=1
        # No coverage driver: setup-php loads Xdebug by default, which disables
        # the JIT and makes the suite several times slower than it is locally.
        coverage: none
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'
    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"
    - name: Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
    - name: Build frontend assets
      # Inertia pages, including error pages, need the Vite manifest.
      run: |
        npm ci --no-audit --no-fund
        npm run build
    - name: Generate key
      run: php artisan key:generate
    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache
    - name: Create Database
      run: |
        mkdir -p database
        touch database/database.sqlite
    - name: Execute tests (shard ${{ matrix.shard }}) via PHPUnit/Pest
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
      shell: bash
      # PHP itself has crashed mid-suite (signal 11) with every test before it
      # passing, on one PHP version and not the other. Cause not found yet. Only
      # that crash gets one more run, and it leaves a warning on the run; a test
      # failure is never retried.
      run: |
        set +e
        php artisan test --testsuite=Shard${{ matrix.shard }} 2>&1 | tee test-output.log
        status=${PIPESTATUS[0]}
        if [ "$status" -ne 0 ] && grep -q 'signaled with signal "11"' test-output.log; then
          echo "::warning::PHP crashed with signal 11 in shard ${{ matrix.shard }}; running the shard once more."
          php artisan test --testsuite=Shard${{ matrix.shard }}
          status=$?
        fi
        exit "$status"

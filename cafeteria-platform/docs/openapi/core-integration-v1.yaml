openapi: 3.1.0
info:
  title: Core integration API
  version: "1"
  summary: Read-only Core master data and the card check, for the systems that consume the Core.
  description: |
    The Core is the only writer of organizations, units, positions, employee identity,
    placements and ID cards. A consuming system reads what its scopes allow, keeps Core
    UUIDs as references, checks cards and listens to webhooks (core-platform/docs/integration-api.md).

    Every answer carries `X-Request-ID`. Dates are `YYYY-MM-DD` and timestamps ISO 8601 with
    offset, always Gregorian: display calendars (Ethiopian or Gregorian) are the consumer's concern.

    A record outside the client's organizations answers 404, never 403. No route returns national
    IDs, dates of birth, phone numbers, e-mail addresses, addresses, photos, signatures, documents
    or credential secrets. This file is checked against the routes by
    `tests/Feature/CoreOpenApiTest.php`.
servers:
  - url: /api/v1/integration
security:
  - clientToken: []
tags:
  - name: Organizations
  - name: Positions
  - name: Employees
  - name: Assignments
  - name: Cards
paths:
  /organizations:
    get:
      tags: [Organizations]
      operationId: listOrganizations
      summary: Organizations in the client's scope, with their parent in the hierarchy in force.
      x-scope: organizations:read
      parameters:
        - $ref: '#/components/parameters/status'
        - $ref: '#/components/parameters/updatedSince'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
      responses:
        '200':
          description: A page of organizations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationPage'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /organizations/{organization}:
    get:
      tags: [Organizations]
      operationId: getOrganization
      x-scope: organizations:read
      parameters:
        - $ref: '#/components/parameters/organization'
      responses:
        '200':
          description: One organization.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Organization' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /positions:
    get:
      tags: [Positions]
      operationId: listPositions
      summary: Positions in the client's scope and whether they are held.
      x-scope: positions:read
      parameters:
        - $ref: '#/components/parameters/organizationId'
        - name: status
          in: query
          description: '`active` for approved positions; any other value for the rest.'
          schema: { type: string, maxLength: 32 }
        - $ref: '#/components/parameters/updatedSince'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
      responses:
        '200':
          description: A page of positions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionPage'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /positions/{position}:
    get:
      tags: [Positions]
      operationId: getPosition
      x-scope: positions:read
      parameters:
        - $ref: '#/components/parameters/position'
      responses:
        '200':
          description: One position.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Position' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /employees:
    get:
      tags: [Employees]
      operationId: listEmployees
      summary: Employees placed in the client's scope.
      x-scope: employees:basic-read
      parameters:
        - $ref: '#/components/parameters/status'
        - $ref: '#/components/parameters/organizationId'
        - $ref: '#/components/parameters/updatedSince'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
      responses:
        '200':
          description: A page of employees.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeePage'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /employees/{employee}:
    get:
      tags: [Employees]
      operationId: getEmployee
      x-scope: employees:basic-read
      parameters:
        - $ref: '#/components/parameters/employee'
      responses:
        '200':
          description: One employee. Name parts and gender only with `employees:read` as well.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Employee' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /employees/{employee}/assignment:
    get:
      tags: [Assignments]
      operationId: getCurrentAssignment
      x-scope: assignments:read
      parameters:
        - $ref: '#/components/parameters/employee'
      responses:
        '200':
          description: The current placement, or null.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/Assignment'
                      - type: 'null'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /employees/{employee}/assignment-history:
    get:
      tags: [Assignments]
      operationId: listAssignmentHistory
      x-scope: assignments:read
      parameters:
        - $ref: '#/components/parameters/employee'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
      responses:
        '200':
          description: Current and past placements, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentPage'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /employees/{employee}/status:
    get:
      tags: [Employees]
      operationId: getEmployeeStatus
      summary: Whether a person may be served now.
      x-scope: employee-status:read
      parameters:
        - $ref: '#/components/parameters/employee'
      responses:
        '200':
          description: Employment, placement and card state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      employee_id: { type: string, format: uuid }
                      employee_number: { type: string }
                      status: { type: string }
                      employed: { type: boolean }
                      assignment_active: { type: boolean }
                      card_valid: { type: boolean }
                      card_code: { $ref: '#/components/schemas/CardCode' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /cards/verify:
    post:
      tags: [Cards]
      operationId: verifyCard
      summary: Checks a card by the token its QR carries, or by its public card UUID.
      description: |
        A QR printed since P3 carries the check address and a credential token; older QR codes carry
        the public card UUID. Send `token` (preferred) or `card_uuid`. Calls are rate limited per client.
      x-scope: cards:verify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string, maxLength: 128, description: The credential token from the QR (the last path segment of its address). }
                card_uuid: { type: string, format: uuid }
              oneOf:
                - required: [token]
                - required: [card_uuid]
      responses:
        '200':
          description: The card's state; serve the person only when `valid` is true.
          content:
            application/json:
              schema:
                type: object
                required: [valid, code, status]
                properties:
                  valid: { type: boolean }
                  code:
                    oneOf:
                      - $ref: '#/components/schemas/CardCode'
                      - type: 'null'
                  status: { type: string }
                  expires_at: { type: [string, 'null'], format: date-time }
                  holder:
                    description: Only for a client that also has `employees:basic-read`.
                    oneOf:
                      - type: object
                        properties:
                          employee_id: { type: string, format: uuid }
                          employee_number: { type: string }
                          full_name: { type: string }
                          organization_id: { type: [string, 'null'], format: uuid }
                      - type: 'null'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No card reachable with this reference (`CARD_NOT_FOUND`) or a credential denial without a card.
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { const: false }
                  code: { type: string }
                  message: { type: string }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
webhooks:
  coreEvent:
    post:
      summary: A Core change event, delivered to a registered webhook endpoint.
      description: |
        Signed with the endpoint's secret: `X-Core-Signature: v1=<hex HMAC-SHA256 of "<X-Core-Timestamp>.<raw body>">`.
        For the grace period after a secret rotation the header carries two comma-separated `v1=` values
        (new, then old): accept either. Refuse timestamps older than five minutes; treat `event_id` as the
        idempotency key. Any 2xx within 10 seconds delivers; otherwise retried after 1, 5, 15, 60, 180, 360
        and 720 minutes, then failed. After repeated failures the endpoint is suspended until resumed; its
        events wait and are sent then.
      parameters:
        - { name: X-Core-Event, in: header, required: true, schema: { $ref: '#/components/schemas/EventType' } }
        - { name: X-Core-Event-Id, in: header, required: true, schema: { type: string } }
        - { name: X-Core-Delivery, in: header, required: true, schema: { type: string } }
        - { name: X-Core-Timestamp, in: header, required: true, schema: { type: string, description: Unix seconds } }
        - { name: X-Core-Signature, in: header, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                event_id: { type: string }
                event_type: { $ref: '#/components/schemas/EventType' }
                occurred_at: { type: string, format: date-time }
                entity_type: { type: string }
                entity_uuid: { type: string }
                payload_version: { const: 1 }
                data: { type: object, description: Identifiers, codes, statuses and dates only. }
      responses:
        '200': { description: Received. }
  /cafeteria/employees/{employee}/entitlement:
    get:
      tags: [Cafeteria]
      operationId: getCafeteriaEntitlement
      summary: The employee's standing in the cafeteria (ADR 0014), for the EUISIS employee portal.
      description: The policy in force at the organization's cafeteria, today's use and any exclusion. Money comes from the cafeteria's own rules.
      x-scope: cafeteria:read
      parameters:
        - $ref: '#/components/parameters/employee'
      responses:
        '200':
          description: The standing.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      employee_id: { type: string, format: uuid }
                      employee_number: { type: string }
                      organization_id: { type: [string, 'null'], format: uuid }
                      eligible: { type: boolean }
                      reason: { type: [string, 'null'] }
                      policy: { type: [object, 'null'] }
                      cafeteria: { type: [object, 'null'] }
                      used_today: { type: integer }
                      exclusion: { type: [object, 'null'] }
                      as_of: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /cafeteria/employees/{employee}/transactions:
    get:
      tags: [Cafeteria]
      operationId: listCafeteriaTransactions
      summary: The employee's recent meals, newest first (up to 100).
      x-scope: cafeteria:read
      parameters:
        - $ref: '#/components/parameters/employee'
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        '200':
          description: The meals.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        transaction_number: { type: string }
                        transaction_date: { type: string, format: date }
                        scanned_at: { type: string, format: date-time }
                        status: { type: string, enum: [accepted, rejected, reversed, pending_review] }
                        subsidy_amount: { type: string }
                        employee_payable_amount: { type: string }
                        total_amount: { type: string }
                        currency_code: { type: [string, 'null'] }
                        is_extra_scan: { type: boolean }
                        cafeteria: { type: [object, 'null'] }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /cafeteria/providers:
    get:
      tags: [Cafeteria]
      operationId: listCafeterias
      summary: The cafeterias (locations) the platform serves.
      x-scope: cafeteria:read
      responses:
        '200':
          description: The cafeterias.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        code: { type: string }
                        name_en: { type: string }
                        name_am: { type: [string, 'null'] }
                        location_type: { type: string }
                        operational_status: { type: string }
                        is_active: { type: boolean }
                        network_id: { type: [string, 'null'], format: uuid }
                        payee_id: { type: [string, 'null'], format: uuid }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /cafeteria/summary:
    get:
      tags: [Cafeteria]
      operationId: getCafeteriaSummary
      summary: A period's totals (today by default), for the EUISIS Situation Room.
      x-scope: cafeteria:read
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        '200':
          description: Scans, meals, employees served, subsidy and what employees paid, per cafeteria.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      from: { type: string, format: date }
                      to: { type: string, format: date }
                      scans: { type: integer }
                      meals: { type: integer }
                      employees: { type: integer }
                      subsidy_amount: { type: string }
                      employee_paid_amount: { type: string }
                      currency_code: { type: string }
                      per_cafeteria: { type: array, items: { type: object } }
                      as_of: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
components:
  securitySchemes:
    clientToken:
      type: http
      scheme: bearer
      description: |
        The API client's secret from Integration Center › API clients (shown once). Each route needs one
        scope (`x-scope`); the client reads only its owner organization and everything under it (none =
        the whole city). Each client has its own limit per minute (default 120): over it, 429 `RATE_LIMITED`
        with `Retry-After`.
  parameters:
    page: { name: page, in: query, schema: { type: integer, minimum: 1 } }
    perPage: { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
    status: { name: status, in: query, schema: { type: string, maxLength: 32 } }
    organizationId: { name: organization_id, in: query, schema: { type: string, format: uuid } }
    updatedSince: { name: updated_since, in: query, description: Changed since this date or time., schema: { type: string } }
    organization: { name: organization, in: path, required: true, schema: { type: string, format: uuid } }
    position: { name: position, in: path, required: true, schema: { type: string, format: uuid } }
    employee: { name: employee, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    Unauthenticated:
      description: Missing, wrong, rotated, revoked or expired secret.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: '`SCOPE_DENIED`, `IP_NOT_ALLOWED`, `CLIENT_INACTIVE`, `CLIENT_REVOKED`, `CLIENT_EXPIRED` or `NOT_AN_API_CLIENT`.'
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Not found, or outside the client's organizations.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ValidationFailed:
      description: '`VALIDATION_FAILED`; `errors` holds the field messages.'
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    RateLimited:
      description: '`RATE_LIMITED`.'
      headers:
        Retry-After: { schema: { type: integer } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    Error:
      type: object
      required: [message, code, errors]
      properties:
        message: { type: string }
        code:
          type: string
          enum: [UNAUTHENTICATED, SCOPE_DENIED, IP_NOT_ALLOWED, CLIENT_INACTIVE, CLIENT_REVOKED, CLIENT_EXPIRED, NOT_AN_API_CLIENT, NOT_FOUND, CARD_NOT_FOUND, VALIDATION_FAILED, RATE_LIMITED]
        errors: { type: object }
    CardCode:
      type: string
      description: Why a card does not verify, in the order checked (credential first, then the card).
      enum: [CARD_NOT_FOUND, CREDENTIAL_UNKNOWN, CREDENTIAL_REVOKED, CREDENTIAL_SUPERSEDED, CREDENTIAL_EXPIRED, KEY_RETIRED, CREDENTIAL_INVALID,
        EMPLOYEE_INACTIVE, CARD_REVOKED, CARD_REPLACED, CARD_EXPIRED, CARD_SUSPENDED, CARD_INACTIVE, ASSIGNMENT_INACTIVE]
    EventType:
      type: string
      enum: [organization.created, organization.updated, organization.archived, organization.deleted, hierarchy.published, unit.created, unit.updated,
        position.created, position.updated, position.status.changed, employee.created, employee.updated, employee.status.changed,
        assignment.created, assignment.changed, assignment.ended, card.approved, card.printed, card.issued, card.activated, card.suspended,
        card.reinstated, card.revoked, card.lost, card.damaged, card.replaced, card.expired]
    PageMeta:
      type: object
      properties:
        links: { type: object }
        meta: { type: object, properties: { current_page: { type: integer }, last_page: { type: integer }, per_page: { type: integer }, total: { type: integer } } }
    Organization:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name_en: { type: string }
        name_am: { type: [string, 'null'] }
        status: { type: string }
        organization_type: { type: [object, 'null'] }
        parent_id: { type: [string, 'null'], format: uuid }
        effective_from: { type: [string, 'null'], format: date }
        effective_to: { type: [string, 'null'], format: date }
        updated_at: { type: string, format: date-time }
    Position:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        title_en: { type: string }
        title_am: { type: [string, 'null'] }
        organization_id: { type: string, format: uuid }
        organization_unit_id: { type: [string, 'null'], format: uuid }
        grade_level: { type: [string, 'null'] }
        is_active: { type: boolean, description: True only for an approved position. }
        occupied: { type: boolean }
        effective_from: { type: [string, 'null'], format: date }
        effective_to: { type: [string, 'null'], format: date }
        updated_at: { type: string, format: date-time }
    Employee:
      type: object
      properties:
        id: { type: string, format: uuid }
        employee_number: { type: string }
        full_name: { type: string }
        name_en: { type: [string, 'null'] }
        status: { type: string }
        current_assignment:
          type: [object, 'null']
          properties:
            id: { type: string, format: uuid }
            organization_id: { type: string, format: uuid }
            organization_unit_id: { type: [string, 'null'], format: uuid }
            position_id: { type: [string, 'null'], format: uuid }
            status: { type: string }
            effective_from: { type: string, format: date }
        first_name: { type: string, description: With `employees:read` only. }
        middle_name: { type: [string, 'null'], description: With `employees:read` only. }
        last_name: { type: string, description: With `employees:read` only. }
        gender: { type: [string, 'null'], description: With `employees:read` only. }
        updated_at: { type: string, format: date-time }
    Assignment:
      type: object
      properties:
        id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        organization_unit_id: { type: [string, 'null'], format: uuid }
        position_id: { type: [string, 'null'], format: uuid }
        status: { type: string }
        is_current: { type: boolean }
        effective_from: { type: string, format: date }
        effective_to: { type: [string, 'null'], format: date }
        reason: { type: [string, 'null'] }
    OrganizationPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            data: { type: array, items: { $ref: '#/components/schemas/Organization' } }
    PositionPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            data: { type: array, items: { $ref: '#/components/schemas/Position' } }
    EmployeePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            data: { type: array, items: { $ref: '#/components/schemas/Employee' } }
    AssignmentPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            data: { type: array, items: { $ref: '#/components/schemas/Assignment' } }

# Agelgay (EUISIS) local container stack.
#
#   cp docker/env.example .env.docker      # once; then set APP_KEY (see docker/README.md)
#   docker compose up --build -d
#   open http://localhost:8080
#
# Services:
#   db         PostgreSQL 18 (data in the db-data volume; port 15432 on this machine)
#   app        PHP-FPM; runs migrations on start when AUTO_MIGRATE=true
#   web        nginx on http://localhost:8080 (APP_PORT overrides)
#   queue      php artisan queue:work  (default, notifications, long)
#   scheduler  php artisan schedule:work
#
# All PHP containers share one image and one storage volume (uploads, logs, cache).

name: euisis

x-app: &app
  build:
    context: .
    target: app
    args:
      # Dev packages (Faker) so `php artisan db:seed` can build the demo data.
      # Set WITH_DEV_DEPS=false in the shell for a lean production-style image.
      WITH_DEV_DEPS: ${WITH_DEV_DEPS:-true}
  image: euisis-app:local
  env_file: .env.docker
  volumes:
    - storage:/var/www/html/storage
  restart: unless-stopped

services:
  db:
    # Matches the PostgreSQL 18 server the development database was copied from.
    image: postgres:18-alpine
    env_file: .env.docker
    environment:
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      # postgres:18+ images keep the data in a version-named subdirectory of this path.
      - db-data:/var/lib/postgresql
    ports:
      # 5433 is refused by Windows on some machines (Hyper-V port reservations); 15432 is safe.
      - "127.0.0.1:${DB_HOST_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    <<: *app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # The entrypoint touches this file once migrations and caches are done.
      test: ["CMD", "test", "-f", "/tmp/app-ready"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s

  web:
    build:
      context: .
      target: web
    image: euisis-web:local
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - storage:/var/www/html/storage:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  queue:
    <<: *app
    command: ["queue"]
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *app
    command: ["scheduler"]
    depends_on:
      app:
        condition: service_healthy

volumes:
  db-data:
  storage:

; Agelgay (EUISIS) PHP settings for the container image.
memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 300
max_input_vars = 5000
; The application sets its own timezone (config/app.php); this is PHP's default.
date.timezone = UTC
expose_php = Off

; OPcache: the code inside the image never changes, so validate_timestamps is off.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 50000
opcache.validate_timestamps = 0
opcache.jit = tracing
opcache.jit_buffer_size = 64M

realpath_cache_size = 4096K
realpath_cache_ttl = 600

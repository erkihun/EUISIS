openapi: 3.0.3
info:
  title: Addis One partner API
  version: "1.2.0"
  description: |
    Partner-facing v1 endpoints after the master backbone remediation
    (docs/architecture/master-backbone-remediation-implementation.md).
    Authentication is a Sanctum bearer token. Organization bounds apply to every
    organization-bound read; out-of-bound records are 404.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      schema: { type: string, pattern: '^[a-zA-Z0-9-]{1,64}$' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 128 }
    EmployeeUuid:
      name: employee
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrganizationUuid:
      name: organization
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
        error_code: { type: string }
        request_id: { type: string, nullable: true }
    PageMeta:
      type: object
      properties:
        current_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        last_page: { type: integer }
    CardVerification:
      type: object
      required: [valid, status]
      properties:
        valid: { type: boolean }
        status: { type: string, enum: [active, revoked, expired, replaced, lost, damaged, suspended, pending_print, printed, issued] }
        card_uuid: { type: string, format: uuid }
        employee_uuid: { type: string, format: uuid, nullable: true }
        organization_uuid: { type: string, format: uuid, nullable: true }
        assignment_status: { type: string, nullable: true }
        verified_at: { type: string, format: date-time }
        card:
          type: object
          properties:
            card_uuid: { type: string, format: uuid }
            card_number: { type: string }
            issued_at: { type: string, format: date, nullable: true }
            expires_at: { type: string, format: date, nullable: true }
            is_current: { type: boolean }
        employee:
          type: object
          nullable: true
          properties:
            employee_uuid: { type: string, format: uuid }
            employee_number: { type: string }
            full_name: { type: string }
            status: { type: string }
            photo_url: { type: string, format: uri, nullable: true, description: 'Signed link, valid photo_expires_in seconds' }
            photo_expires_in: { type: integer }
        organization:
          type: object
          nullable: true
          properties:
            organization_uuid: { type: string, format: uuid }
            code: { type: string }
            name_en: { type: string }
            name_am: { type: string, nullable: true }
        position:
          type: object
          nullable: true
          properties:
            code: { type: string }
            title_en: { type: string }
            title_am: { type: string, nullable: true }
        request_id: { type: string, nullable: true }
    Eligibility:
      type: object
      required: [eligible, reason_code, checked_at]
      properties:
        eligible: { type: boolean }
        reason_code: { type: string, nullable: true }
        message: { type: string, nullable: true }
        card_status: { type: string, nullable: true }
        service:
          type: object
          properties:
            service_type: { type: string }
        effective_context:
          type: object
          properties:
            employee_uuid: { type: string, format: uuid }
            employee_number: { type: string }
            employee_status: { type: string }
            card_uuid: { type: string, format: uuid, nullable: true }
            card_status: { type: string, nullable: true }
            organization_uuid: { type: string, format: uuid, nullable: true }
        checked_at: { type: string, format: date-time }
        request_id: { type: string, nullable: true }
    VerificationResult:
      type: object
      properties:
        data:
          type: object
          properties:
            allowed: { type: boolean }
            result_code: { type: string }
            denial_reason: { type: string, nullable: true }
            card_status: { type: string, nullable: true }
            employee_status: { type: string, nullable: true }
            service_type: { type: string }
            quota_remaining: { type: integer, nullable: true }
    EventEnvelope:
      type: object
      description: 'See docs/integration/event-catalog.md and schemas/event-envelope.v1.json.'
      required: [event_id, event_type, event_version, aggregate_type, aggregate_uuid, organization_uuid, sequence, change_kind, occurred_at, effective_at, correlation_id, data]
      properties:
        event_id: { type: string, format: uuid }
        event_type: { type: string, example: id_card.revoked }
        event_version: { type: integer, example: 1 }
        aggregate_type: { type: string, enum: [organization, organization_unit, position, employee, employee_placement, assignment, id_card, hierarchy_version] }
        aggregate_uuid: { type: string }
        organization_uuid: { type: string, format: uuid, nullable: true }
        sequence: { type: integer }
        change_kind: { type: string, enum: [upsert, tombstone] }
        occurred_at: { type: string, format: date-time }
        effective_at: { type: string, format: date, nullable: true }
        correlation_id: { type: string, nullable: true }
        data: { type: object, additionalProperties: true }
    ChangePage:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/EventEnvelope' } }
        next_cursor: { type: string }
        has_more: { type: boolean }
        request_id: { type: string, nullable: true }
    WebhookSubscription:
      type: object
      properties:
        subscription_id: { type: string, format: uuid }
        name: { type: string }
        callback_url: { type: string, format: uri }
        event_types: { type: array, items: { type: string } }
        status: { type: string, enum: [active, disabled] }
        health: { type: string, enum: [healthy, degraded, failing, unknown] }
        secret_rotated_at: { type: string, format: date-time, nullable: true }
        previous_secret_valid_until: { type: string, format: date-time, nullable: true }
        last_success_at: { type: string, format: date-time, nullable: true }
        last_failure_at: { type: string, format: date-time, nullable: true }
        last_failure_category: { type: string, nullable: true }
  responses:
    Unauthorized: { description: Not authenticated, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden: { description: Not allowed (scope, endpoint, IP, status, provider binding, permission), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: Not found or outside the caller organization bound, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflict: { description: Idempotency conflict (idempotency_in_progress, idempotency_key_reused), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unprocessable: { description: Validation failed }
    TooMany: { description: Rate limit, headers: { Retry-After: { schema: { type: integer } } } }
paths:
  /id-cards/verify/{token}:
    get:
      summary: Verify a card by its public card UUID
      description: 'Scope id_cards.verify. Photo link requires employees.photo_read.'
      parameters:
        - { name: token, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200': { description: Card found in bound, content: { application/json: { schema: { $ref: '#/components/schemas/CardVerification' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooMany' }
  /employees/{employee}/service-eligibility:
    get:
      summary: Ask whether an employee may receive a service now
      description: 'Scope service_eligibility.check. 403 carries the same body when not eligible.'
      parameters:
        - $ref: '#/components/parameters/EmployeeUuid'
        - { name: service_type, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: Eligible, content: { application/json: { schema: { $ref: '#/components/schemas/Eligibility' } } } }
        '403': { description: Not eligible (or forbidden), content: { application/json: { schema: { $ref: '#/components/schemas/Eligibility' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /employees/{employee}/photo:
    get:
      summary: Signed, short-lived ID photo (link from card verification only)
      security: []
      parameters:
        - $ref: '#/components/parameters/EmployeeUuid'
        - { name: principal, in: query, required: true, schema: { type: string } }
        - { name: expires, in: query, required: true, schema: { type: integer } }
        - { name: signature, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: Image, content: { image/jpeg: {}, image/png: {}, image/webp: {} } }
        '403': { description: Invalid or expired signature }
        '404': { $ref: '#/components/responses/NotFound' }
  /organizations:
    get:
      summary: Active organization directory (picker)
      description: 'Scope reports.read_limited.'
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, maximum: 500, default: 100 } }
      responses:
        '200': { description: Organizations in bound }
  /organizations/directory:
    get:
      summary: Paginated organizations
      description: 'Scope organizations.read.'
      parameters: [ { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PerPage' } ]
      responses:
        '200': { description: Page, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { type: object } }, meta: { $ref: '#/components/schemas/PageMeta' } } } } } }
  /organizations/{organization}:
    get:
      summary: One organization
      parameters: [ { $ref: '#/components/parameters/OrganizationUuid' } ]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } }
  /organizations/{organization}/units:
    get:
      summary: Units of an organization (organization_units.read)
      parameters: [ { $ref: '#/components/parameters/OrganizationUuid' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PerPage' } ]
      responses: { '200': { description: Page }, '404': { $ref: '#/components/responses/NotFound' } }
  /organizations/{organization}/positions:
    get:
      summary: Positions of an organization (positions.read)
      parameters: [ { $ref: '#/components/parameters/OrganizationUuid' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PerPage' } ]
      responses: { '200': { description: Page }, '404': { $ref: '#/components/responses/NotFound' } }
  /organizations/{organization}/employees:
    get:
      summary: Employees currently assigned to an organization (employees.basic_read)
      parameters: [ { $ref: '#/components/parameters/OrganizationUuid' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PerPage' } ]
      responses: { '200': { description: Page }, '404': { $ref: '#/components/responses/NotFound' } }
  /organizations/{organization}/structure:
    get:
      summary: Nested structure (organization_structure.read)
      parameters:
        - $ref: '#/components/parameters/OrganizationUuid'
        - { name: depth, in: query, schema: { type: string, enum: [unit, position, employee], default: position } }
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { description: structure_too_large } }
  /employees:
    get:
      summary: Employees in bound (employees.basic_read)
      parameters: [ { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PerPage' } ]
      responses: { '200': { description: Page } }
  /employees/{employee}:
    get:
      summary: One employee (employees.basic_read)
      parameters: [ { $ref: '#/components/parameters/EmployeeUuid' } ]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } }
  /employees/{employee}/assignment:
    get:
      summary: Current assignment (employee_assignments.read)
      parameters: [ { $ref: '#/components/parameters/EmployeeUuid' } ]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } }
  /cards/verify:
    post:
      summary: Provider card verification for a service (id_cards.verify, provider-bound)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, service_type]
              properties:
                token: { type: string, description: '<card_id>|<raw token> from the card QR' }
                service_type: { type: string }
                provider_code: { type: string }
      responses:
        '200': { description: Decision, content: { application/json: { schema: { $ref: '#/components/schemas/VerificationResult' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /services/{serviceType}/transactions:
    post:
      summary: Authorize and record a service transaction (service_transactions.create, provider-bound)
      parameters:
        - { name: serviceType, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, provider_code]
              properties:
                token: { type: string }
                provider_code: { type: string }
                reference: { type: string }
                amount: { type: number, minimum: 0 }
      responses:
        '200': { description: Decision, content: { application/json: { schema: { $ref: '#/components/schemas/VerificationResult' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /offline-sync/transactions:
    post:
      summary: Verify an offline batch (≤200 items; every provider_code must be the bound provider)
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transactions]
              properties:
                transactions:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required: [token, service_type, provider_code]
                    properties:
                      token: { type: string }
                      service_type: { type: string }
                      provider_code: { type: string }
      responses:
        '200': { description: Per-item results with index }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /providers/{provider}/settlements/{period}:
    get:
      summary: Settled total for a month (YYYY-MM) or day (YYYY-MM-DD) (reports.read_limited, provider-bound)
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: period, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Settlement
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider_id: { type: string, format: uuid }
                  period: { type: string }
                  period_start: { type: string, format: date }
                  period_end: { type: string, format: date }
                  settlement_amount: { type: number }
                  transaction_count: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: invalid_period }
  /changes:
    get:
      summary: Ordered change feed (changes.read + the domain scope of each type; organization bound applied)
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: event_types, in: query, schema: { type: string }, description: Comma-separated }
        - { name: aggregate_types, in: query, schema: { type: string }, description: Comma-separated }
      responses:
        '200': { description: Page, content: { application/json: { schema: { $ref: '#/components/schemas/ChangePage' } } } }
        '400': { description: invalid_cursor, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: change_feed_disabled }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /changes/watermark:
    get:
      summary: Current end of the feed (bootstrap)
      responses:
        '200': { description: Watermark, content: { application/json: { schema: { type: object, properties: { cursor: { type: string }, as_of: { type: string, format: date-time, nullable: true } } } } } }
  /changes/reconcile:
    post:
      summary: Latest visible sequence per aggregate UUID (at most 100)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [aggregate_type, uuids]
              properties:
                aggregate_type: { type: string }
                uuids: { type: array, maxItems: 100, items: { type: string } }
      responses:
        '200':
          description: Versions
          content:
            application/json:
              schema:
                type: object
                properties:
                  aggregate_type: { type: string }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        aggregate_uuid: { type: string }
                        found: { type: boolean }
                        sequence: { type: integer }
                        last_event_id: { type: string, format: uuid }
                        last_event_type: { type: string }
                        change_kind: { type: string }
                        occurred_at: { type: string, format: date-time }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /webhook-subscriptions:
    get:
      summary: Own webhook subscriptions (webhooks.manage). Secrets are never returned.
      responses:
        '200': { description: List, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/WebhookSubscription' } } } } } } }
  /webhook-subscriptions/{subscription}/deliveries:
    get:
      summary: Delivery history of an own subscription (metadata only)
      parameters:
        - { name: subscription, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [pending, in_flight, retrying, succeeded, dead, skipped] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200': { description: Deliveries }
        '404': { $ref: '#/components/responses/NotFound' }
  /webhook-subscriptions/{subscription}/replay:
    post:
      summary: Replay events to an own subscription with their original event_ids (webhooks.replay)
      parameters:
        - { name: subscription, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 500 }
                event_ids: { type: array, items: { type: string, format: uuid } }
                from: { type: string, format: date-time }
                to: { type: string, format: date-time }
                event_types: { type: array, items: { type: string } }
                only_failed: { type: boolean }
      responses:
        '202': { description: Queued, content: { application/json: { schema: { type: object, properties: { replay_id: { type: string, format: uuid }, event_count: { type: integer }, status: { type: string } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
    Fontconfig for server-side ID card rasterisation (Imagick + librsvg).

    IdCardPngExporter points FONTCONFIG_FILE here when the environment has not
    set it, so the PNG is drawn with the same Inter / Noto Sans Ethiopic the
    browser preview uses, whatever fonts the server happens to have installed.
    Paths are relative to this file.
-->
<fontconfig>
    <!-- Keep every system font available as a fallback. -->
    <include ignore_missing="yes">/etc/fonts/fonts.conf</include>

    <!-- The application's bundled fonts (see README.md in this directory). -->
    <dir prefix="relative">.</dir>

    <cachedir prefix="relative">../../storage/framework/cache/fontconfig</cachedir>
</fontconfig>
